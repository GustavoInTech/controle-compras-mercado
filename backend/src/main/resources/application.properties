spring.application.name=compras

# Lê usuário e senha do arquivo .env (o mesmo que o Docker usa: uma fonte só)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# As tabelas são criadas só pelo Flyway; o Hibernate apenas confere se estão como as classes esperam
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false